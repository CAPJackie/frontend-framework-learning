packages:
  - "apps/*"
  - "packages/*"

# Native-binary build scripts we trust across the toolchains in this monorepo.
# esbuild/lightningcss: Vite / TanStack Start / Astro. lmdb/@parcel/watcher: Angular.
# unrs-resolver: eslint import resolver. sharp: Astro images. vue-demi: Pinia.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lightningcss: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2003.36'
  - '@angular-devkit/core@20.3.36'
  - '@angular-devkit/schematics@20.3.36'
  - '@angular/build@20.3.36'
  - '@angular/cli@20.3.36'
  - '@schematics/angular@20.3.36'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - lightningcss
  - lmdb
  - msgpackr-extract
  - sharp
  - unrs-resolver
  - vue-demi

verifyDepsBeforeRun: false
